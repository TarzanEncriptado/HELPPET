services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: healthpet
      MYSQL_USER: healthpet
      MYSQL_PASSWORD: healthpet_local_password
      MYSQL_ROOT_PASSWORD: local_root_password_only
    ports:
      - '3306:3306'
    volumes:
      - healthpet-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  healthpet-mysql:
