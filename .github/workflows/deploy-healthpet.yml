name: Deploy HEALTHPET to GitHub Pages

on:
  push:
    branches:
      - TarzanEncriptado-patch-1
    paths:
      - 'healthpet-final/**'
      - '.github/workflows/deploy-healthpet.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: healthpet-final/package-lock.json

      - name: Install dependencies
        working-directory: healthpet-final
        run: npm ci

      - name: Lint
        working-directory: healthpet-final
        run: npm run lint

      - name: Build site
        working-directory: healthpet-final
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: healthpet-final/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
